name: Savo SiteScout CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: sitescout_test
          POSTGRES_USER: sitescout
          POSTGRES_PASSWORD: sitescout_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"

      - name: Run Ruff Linter
        run: |
          ruff check backend/app backend/tests backend/scripts

      - name: Run Bandit Security Scan
        run: |
          bandit -r backend/app backend/scripts -q -ll

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql+psycopg://sitescout:sitescout_test_password@localhost:5432/sitescout_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: |
          cd backend
          pytest tests/ -v

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci --prefix frontend

      - name: Build and Typecheck Frontend
        run: |
          npm run build --prefix frontend
