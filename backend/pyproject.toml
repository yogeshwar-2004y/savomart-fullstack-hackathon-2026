[project]
name = "savo-sitescout-backend"
version = "0.1.0"
description = "FastAPI backend foundation for Savo SiteScout"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13.2",
    "fastapi>=0.115.0",
    "geoalchemy2>=0.15.2",
    "httpx>=0.27.2",
    "psycopg[binary]>=3.2.1",
    "pydantic-settings>=2.4.0",
    "redis>=5.0.8",
    "rq>=1.16.2",
    "shapely>=2.0.6",
    "sqlalchemy>=2.0.32",
    "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
